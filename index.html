<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spelling Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      margin: 0;
      background: #f0f4f8;
      color: #333;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      font-size: 1.5em;
      margin-bottom: 20px;
    }
    .sentence, .typed-word, .feedback, .score, .summary {
      text-align: center;
      margin: 10px 0;
    }
    .retry-button {
     display: block;
     margin: 10px auto; /* auto centers horizontally */
     }

    .typed-word {
      font-size: 1.4em;
      letter-spacing: 2px;
    }
    .keyboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vw;
      margin-bottom: 20px;
      /* Bleed out past the body's 20px side padding so the keyboard gets
         the full screen width to work with, independent of the rest of
         the page's margins. */
      width: calc(100% + 40px);
      margin-left: -20px;
      margin-right: -20px;
      padding: 0 6px;
      box-sizing: border-box;
    }
    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: nowrap; /* rows must never wrap - key size below guarantees they fit */
      width: 100%;
    }
    .keyboard-row button {
      /* Key size is derived purely from viewport width (vw/px), never from
         em/rem/% font-size. This makes it immune to OS/browser "text size"
         accessibility settings, which only scale em/rem-based text.
         Formula: fit exactly 10 keys + 9 gaps into the space left after the
         keyboard's own 6px side gutter (12px total). Clamped between a
         usable floor and a sensible ceiling so it never gets silly small
         or big. */
      --kb-w: clamp(24px, calc((100vw - 12px - 9 * 4px) / 10), 44px);
      width: var(--kb-w);
      height: calc(var(--kb-w) * 1.3); /* taller than wide - width is the tight
                                           constraint (10 across the screen),
                                           height has room to spare, and
                                           taller targets are easier to tap */
      flex: 0 0 auto;
      padding: 0;
      box-sizing: border-box;
      font-size: calc(var(--kb-w) * 0.45);
      line-height: 1;
      background: #0078D4;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .keyboard-row button:hover {
      background: #005fa3;
    }
    .controls button {
      padding: 12px;
      font-size: 1em;
      background: #0078D4;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      width: 100%;
    }
    .correct-word {
      color: green;
      font-weight: bold;
      font-size: 2em;
      display: block;
      margin-top: 10px;
    }
    .incorrect-word {
      color: red;
      text-decoration: line-through;
      font-size: 2em;
      display: block;
    }
  </style>
</head>
<body>

<h1>Spelling Challenge</h1>

<div style="text-align:center; margin-bottom:20px;">
  <label for="termSelect">Select Term:</label>
  <select id="termSelect" onchange="onTermChange()"></select>

  <label for="weekSelect">Select Week:</label>
  <select id="weekSelect" onchange="selectTermAndWeek()"></select>
</div>

<div class="sentence" id="sentenceDisplay"></div>
<div class="typed-word" id="typedWordDisplay">_ _ _ _ _</div>
<div class="keyboard" id="keyboard"></div>

<div class="controls">
  <button id="checkButton" onclick="checkAnswer()">Check Answer</button>
  <button onclick="backspace()">Backspace</button>
</div>

<div class="feedback" id="feedback"></div>
<div class="score" id="score">Score: 0</div>
<button id="retryButton" class="retry-button" style="display:none;" onclick="startRetry()">Retry Incorrect Words</button>

<div class="summary" id="summary"></div>

<div id="correctReview" style="display:none; text-align:center; margin-top:20px;">
  <div style="font-size:2em; font-weight:bold;" id="correctWordDisplay"></div>
  <button onclick="continueAfterReview()" style="margin-top:15px;">Continue</button>
</div>

<div style="text-align:center; margin-top:10px;">
  <button onclick="listenAgain()">🔊 Listen Again</button>
</div>

<script>

const allWords = [
{ term: "Autumn 1",  week: 1, word: "vicious", sentence: "The dog gave a ________ growl at the stranger." },
{ term: "Autumn 1",  week: 1, word: "gracious", sentence: "She was very ________ when she accepted the award." },
{ term: "Autumn 1",  week: 1, word: "spacious", sentence: "Their new house has a ________ living room." },
{ term: "Autumn 1",  week: 1, word: "malicious", sentence: "He spread ________ rumours about his classmate." },
{ term: "Autumn 1",  week: 1, word: "precious", sentence: "The necklace was her most ________ possession." },
{ term: "Autumn 1",  week: 1, word: "conscious", sentence: "He remained ________ throughout the whole journey." },
{ term: "Autumn 1",  week: 1, word: "delicious", sentence: "The cake tasted absolutely ________." },
{ term: "Autumn 1",  week: 1, word: "suspicious", sentence: "The police were ________ of his strange behaviour." },
{ term: "Autumn 1",  week: 1, word: "atrocious", sentence: "The weather was ________ during our holiday." },
{ term: "Autumn 1",  week: 1, word: "ferocious", sentence: "The lion let out a ________ roar." },
{ term: "Autumn 1",  week: 2, word: "ambitious", sentence: "She has ________ plans to start her own business." },
{ term: "Autumn 1",  week: 2, word: "cautious", sentence: "Be ________ when you cross the busy road." },
{ term: "Autumn 1",  week: 2, word: "fictitious", sentence: "The characters in the novel are entirely ________." },
{ term: "Autumn 1",  week: 2, word: "infectious", sentence: "Her laughter was so ________ that soon everyone was giggling." },
{ term: "Autumn 1",  week: 2, word: "nutritious", sentence: "A ________ breakfast helps you concentrate at school." },
{ term: "Autumn 1",  week: 2, word: "contentious", sentence: "It was a ________ topic during the debate." },
{ term: "Autumn 1",  week: 2, word: "superstitious", sentence: "He’s ________ about walking under ladders." },
{ term: "Autumn 1",  week: 2, word: "pretentious", sentence: "The critic thought the film was ________ and dull." },
{ term: "Autumn 1",  week: 2, word: "anxious", sentence: "She felt ________ before her spelling test." },
{ term: "Autumn 1",  week: 2, word: "obnoxious", sentence: "His ________ behaviour annoyed everyone at the party." },
{ term: "Autumn 1",  week: 3, word: "symbol", sentence: "A heart is often used as a ________ of love." },
{ term: "Autumn 1",  week: 3, word: "mystery", sentence: "The detective solved the ________ quickly." },
{ term: "Autumn 1",  week: 3, word: "lyrics", sentence: "She wrote the ________ for the new song." },
{ term: "Autumn 1",  week: 3, word: "oxygen", sentence: "Plants release ________ into the air." },
{ term: "Autumn 1",  week: 3, word: "symptom", sentence: "A high temperature can be a ________ of illness." },
{ term: "Autumn 1",  week: 3, word: "physical", sentence: "Running is a good form of ________ exercise." },
{ term: "Autumn 1",  week: 3, word: "system", sentence: "The school has installed a new computer ________." },
{ term: "Autumn 1",  week: 3, word: "typical", sentence: "It was a ________ rainy day in England." },
{ term: "Autumn 1",  week: 3, word: "crystal", sentence: "The chandelier was made from sparkling ________." },
{ term: "Autumn 1",  week: 3, word: "rhythm", sentence: "The drummer kept a steady ________ throughout the song." },
{ term: "Autumn 1",  week: 4, word: "apply", sentence: "You need to ________ for the job online." },
{ term: "Autumn 1",  week: 4, word: "supply", sentence: "The shop ran out of ________ before Christmas." },
{ term: "Autumn 1",  week: 4, word: "identify", sentence: "Can you ________ the bird in this photograph?" },
{ term: "Autumn 1",  week: 4, word: "occupy", sentence: "The soldiers continued to ________ the town." },
{ term: "Autumn 1",  week: 4, word: "multiply", sentence: "You can ________ two numbers using a calculator." },
{ term: "Autumn 1",  week: 4, word: "rhyme", sentence: "‘Cat’ and ‘hat’ ________ with each other." },
{ term: "Autumn 1",  week: 4, word: "cycle", sentence: "He likes to ________ to school every day." },
{ term: "Autumn 1",  week: 4, word: "python", sentence: "The zoo has a large ________ in its reptile house." },
{ term: "Autumn 1",  week: 4, word: "hygiene", sentence: "Good ________ helps to prevent illness." },
{ term: "Autumn 1",  week: 4, word: "hyphen", sentence: "Use a ________ to join the two words together." },
{ term: "Autumn 1",  week: 5, word: "past", sentence: "We drove ________ the old church." },
{ term: "Autumn 1",  week: 5, word: "passed", sentence: "She ________ her driving test yesterday." },
{ term: "Autumn 1",  week: 5, word: "proceed", sentence: "Please ________ to the next gate." },
{ term: "Autumn 1",  week: 5, word: "precede", sentence: "A warning sign will ________ the roadworks." },
{ term: "Autumn 1",  week: 5, word: "aisle", sentence: "He walked down the ________ to find the milk." },
{ term: "Autumn 1",  week: 5, word: "isle", sentence: "The ________ of Wight is on the south coast of England." },
{ term: "Autumn 1",  week: 5, word: "aloud", sentence: "She read the poem ________ to the class." },
{ term: "Autumn 1",  week: 5, word: "allowed", sentence: "You’re not ________ to run in the corridor." },
{ term: "Autumn 1",  week: 5, word: "affect", sentence: "Loud noise can ________ your concentration." },
{ term: "Autumn 1",  week: 5, word: "effect", sentence: "The medicine had an instant ________ on her headache." },
{ term: "Autumn 1",  week: 6, word: "farther", sentence: "London is ________ from here than Bristol." },
{ term: "Autumn 1",  week: 6, word: "father", sentence: "My ________ works as an engineer." },
{ term: "Autumn 1",  week: 6, word: "guessed", sentence: "I ________ the answer correctly." },
{ term: "Autumn 1",  week: 6, word: "guest", sentence: "The hotel welcomed each ________ warmly." },
{ term: "Autumn 1",  week: 6, word: "heard", sentence: "She ________ a strange noise outside." },
{ term: "Autumn 1",  week: 6, word: "herd", sentence: "A ________ of cows crossed the field." },
{ term: "Autumn 1",  week: 6, word: "led", sentence: "The guide ________ us through the museum." },
{ term: "Autumn 1",  week: 6, word: "lead", sentence: "Pencils don’t actually contain any ________." },
{ term: "Autumn 1",  week: 6, word: "mourning", sentence: "The family was ________ the loss of their pet." },
{ term: "Autumn 1",  week: 6, word: "morning", sentence: "We go for a run every ________ before school." },
];

let selectedTerm = 1;
let selectedWeek = 1;
let isReviewMode = false;
let words = [];
let current = 0;
let score = 0;
let incorrectWords = [];
let attemptHistory = [];
let typedWord = "";

function speak(text) {
  speechSynthesis.cancel(); // stop any word still being read before starting the next
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-GB";
  speechSynthesis.speak(utterance);
}

function getRandomWords(array, count) {
  const shuffled = [...array].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count).map(w => ({ ...w }));
}

function loadQuestion() {
  
  typedWord = "";
  document.getElementById("feedback").textContent = "";
  updateSentence();
  updateTypedDisplay();
  renderKeyboard();
  const fullSentence = words[current].sentence.replace("________", words[current].word);
  speak(fullSentence);
  document.getElementById("checkButton").disabled = false;

}


function updateSentence() {
  const correctWord = words[current].word;
  let displayWord = "";
  for (let i = 0; i < correctWord.length; i++) {
    displayWord += typedWord[i] ? typedWord[i] : "_";
  }
  const updated = words[current].sentence.replace("________", displayWord);
  document.getElementById("sentenceDisplay").textContent = updated;
}

function updateTypedDisplay() {
  const correctWord = words[current].word;
  let display = "";
  for (let i = 0; i < correctWord.length; i++) {
    display += typedWord[i] ? typedWord[i] + " " : "_ ";
  }
  document.getElementById("typedWordDisplay").textContent = display.trim();
}

function renderKeyboard() {
  const keyboard = document.getElementById("keyboard");
  keyboard.innerHTML = "";
  const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM","-'"];
  rows.forEach(row => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "keyboard-row";
    row.split("").forEach(letter => {
      const btn = document.createElement("button");
      btn.textContent = letter;
      btn.onclick = () => typeLetter(letter.toLowerCase());
      rowDiv.appendChild(btn);
    });
    keyboard.appendChild(rowDiv);
  });
}

function typeLetter(letter) {
  const correctWord = words[current].word;
  if (typedWord.length < correctWord.length) {
    typedWord += letter;
    updateSentence();
    updateTypedDisplay();
  }
}

function backspace() {
  typedWord = typedWord.slice(0, -1);
  updateSentence();
  updateTypedDisplay();
}

function checkAnswer() {
  if (!typedWord || typedWord.trim().length === 0) return;
  const correct = words[current].word.toLowerCase();
  document.getElementById("checkButton").disabled = true;

  if (typedWord === correct) {
    score++;
    document.getElementById("feedback").textContent = "✅ Correct!";
    document.getElementById("score").textContent = `Score: ${score}`;
    current++;
    setTimeout(() => {
      if (current < words.length) {
        loadQuestion();
      } else {
        attemptHistory.push({ correct: score, total: words.length });
        showSummary();
      }
    }, 1500);
  } else {
    document.getElementById("feedback").textContent = "❌ Incorrect.";
    document.getElementById("correctWordDisplay").innerHTML = `
      <span class="incorrect-word">${typedWord}</span>
      <span class="correct-word">${words[current].word}</span>
    `;
    document.getElementById("correctReview").style.display = "block";
    document.querySelector(".controls").style.display = "none";
    document.getElementById("keyboard").style.display = "none";
    incorrectWords.push(words[current]);
  }
}

function continueAfterReview() {
  document.getElementById("correctReview").style.display = "none";
  document.querySelector(".controls").style.display = "block";
  document.getElementById("keyboard").style.display = "flex";
  document.getElementById("score").textContent = `Score: ${score}`;
  current++;
  if (current < words.length) {
    loadQuestion();
  } else {
    attemptHistory.push({ correct: score, total: words.length });
    showSummary();
  }
}

function listenAgain() {
  const fullSentence = words[current].sentence.replace("________", words[current].word);
  speak(fullSentence);
}

function showSummary() {
  let summaryText = "🎉 Game Over!<br><br>";
  attemptHistory.forEach((attempt, index) => {
    summaryText += `Attempt ${index + 1}: ${attempt.correct} / ${attempt.total}<br>`;
  });

  document.getElementById("sentenceDisplay").textContent = "";
  document.getElementById("typedWordDisplay").textContent = "";
  document.getElementById("keyboard").innerHTML = "";
  document.querySelector(".controls").style.display = "none";
  document.getElementById("feedback").textContent = "";
  document.getElementById("score").textContent = "";
  document.getElementById("summary").innerHTML = summaryText;

  const retryable = incorrectWords.some(w => w.term === selectedTerm);
  if (retryable) {
    document.getElementById("retryButton").style.display = "block";
  }
}

function startRetry() {
  const uniqueIncorrect = Array.from(
    new Map(
      incorrectWords
        .filter(w => w.term === selectedTerm)
        .map(w => [w.word, w])
    ).values()
  );

  words = getRandomWords(uniqueIncorrect, Math.min(10, uniqueIncorrect.length));
  incorrectWords = [];
  current = 0;
  score = 0;
  typedWord = "";
  document.querySelector(".controls").style.display = "block";
  document.getElementById("retryButton").style.display = "none";
  document.getElementById("summary").innerHTML = "";
  document.getElementById("score").textContent = "Score: 0";
  loadQuestion();
}


function populateSelectors() {
  const termSelect = document.getElementById("termSelect");
  const terms = [...new Set(allWords.map(w => w.term))].sort((a, b) => a.localeCompare(b));
  termSelect.innerHTML = terms.map(t => `<option value="${t}">Term ${t}</option>`).join("");
  updateWeekOptions(terms[0]);
}

function updateWeekOptions(term) {
  const weekSelect = document.getElementById("weekSelect");
  const weeks = [...new Set(allWords.filter(w => w.term === term).map(w => w.week))].sort((a, b) => a - b);
  weekSelect.innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join("") +
                         `<option value="review">Review Week</option>`;
}

function onTermChange() {
  selectedTerm = document.getElementById("termSelect").value;
  updateWeekOptions(selectedTerm);
  selectTermAndWeek();
}

function selectTermAndWeek() {
  const weekValue = document.getElementById("weekSelect").value;
  isReviewMode = weekValue === "review";
  selectedWeek = isReviewMode ? null : parseInt(weekValue);

  words = isReviewMode
    ? getRandomWords(allWords.filter(w => w.term === selectedTerm), 10)
    : allWords.filter(w => w.term === selectedTerm && w.week === selectedWeek).map(w => ({ ...w }));

  current = 0;
  score = 0;
  incorrectWords = [];
  typedWord = "";
  document.getElementById("summary").innerHTML = "";
  document.getElementById("score").textContent = "Score: 0";
  document.getElementById("retryButton").style.display = "none";
  document.getElementById("correctReview").style.display = "none";
  document.querySelector(".controls").style.display = "block";
  document.getElementById("keyboard").style.display = "flex";
  loadQuestion();
}

window.onload = () => {
  populateSelectors();
  const firstTerm = [...new Set(allWords.map(w => w.term))][0];
  document.getElementById("termSelect").value = firstTerm;
  onTermChange();
};


document.addEventListener("keydown", (event) => {
  const key = event.key.toUpperCase();
  const button = [...document.querySelectorAll(".keyboard-row button")]
    .find(btn => btn.textContent === key);

  if (button) {
    button.click();
  } else if (event.key === "Backspace") {
    backspace();
  } else if (event.key === "Enter") {
    const checkBtn = document.getElementById("checkButton");
    if (!checkBtn.disabled) {
      checkAnswer();
    }
   
  }
});

</script>

</body>
</html>
